name: Publish npm package

# Publishes @isothrum/editor to npm with npm Trusted Publishing: the job authenticates over OIDC at
# run time (no long-lived NODE_AUTH_TOKEN / _authToken is stored), and npm attaches a provenance
# attestation automatically. Triggered by a release tag `vX.Y.Z` or run by hand from the Actions tab.
#
# Setup (done once by the maintainer, on npmjs.com): the package @isothrum/editor must already exist
# on the registry — npm Trusted Publishers are configured per package, so a brand-new package name
# cannot be created by trusted publishing and must be bootstrapped with one manual `npm publish`
# first. Then, on the package's "Settings → Trusted Publisher" page, add a GitHub Actions publisher
# pointing at repository `Isothrum/isothrum-ui`, this workflow file (`publish-npm.yml`) and the
# `npm-publish` environment. See PUBLISHING.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The check (gate.yml): a tag doesn't run it otherwise, and nothing is published unless it passes.
  gate:
    uses: ./.github/workflows/gate.yml

  publish:
    name: Publish to npm
    needs: gate
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      # Required for npm Trusted Publishing (OIDC); no NODE_AUTH_TOKEN secret is used.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # registry-url points npm at the public registry; no token is written because trusted
      # publishing authenticates over OIDC.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships: a guard, nothing
      # installed from outside the pinned runner tools.
      - name: npm supports trusted publishing
        run: |
          set -euo pipefail
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)" ||
            { echo "::error::npm $(npm --version) can't publish with trusted publishing (11.5.1 or later)"; exit 1; }

      - name: Install dependencies
        run: npm ci

      # prepack rebuilds dist/ from the commit the gate checked. npm
      # detects the OIDC trusted publisher and generates provenance automatically.
      - name: Publish
        run: npm publish --access public --provenance
